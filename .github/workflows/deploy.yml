name: Deploy ACBC

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DATABASE_URL,AUTH_SECRET,FRONTEND_URL,LETTERMINT_API_KEY,MAIL_FROM,ENVIRONMENT
          script: |
            cat > /opt/acbc/.env << EOF
            DATABASE_URL=$DATABASE_URL
            AUTH_SECRET=$AUTH_SECRET
            FRONTEND_URL=$FRONTEND_URL
            LETTERMINT_API_KEY=$LETTERMINT_API_KEY
            MAIL_FROM=$MAIL_FROM
            ENVIRONMENT=$ENVIRONMENT
            EOF
            /opt/acbc/deploy.sh
